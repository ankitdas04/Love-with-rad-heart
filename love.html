<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Draw Heart Character</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            /* Dark background to make the white card pop, or dark gray */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .card {
            position: relative;
            width: 900px;
            height: 600px;
            transform-origin: center;
            background-color: #fdfdfd;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .character-wrapper {
            position: absolute;
            left: 100px;
            top: 200px;
            width: 250px;
            height: 250px;
        }

        .character-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* SVG Drawing Animation */
        .draw-line {
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: draw 1.5s ease-in-out forwards;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .delay-1 {
            animation-delay: 1.5s;
        }

        .delay-2 {
            animation-delay: 1.8s;
        }

        .opacity-80 {
            /* To keep the blush lightly transparent, we can finish at 0.8 opacity */
            animation-name: fadeIn80;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeIn80 {
            to {
                opacity: 0.8;
            }
        }

        /* "biu" text popping */
        .biu-text {
            position: absolute;
            right: 10px;
            top: 90px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            font-size: 26px;
            font-weight: bold;
            color: #ff69b4;
            /* Pink color */
            opacity: 0;
            transform: rotate(15deg) scale(0.5);
            animation: popBiu 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 2.2s;
        }

        @keyframes popBiu {
            0% {
                opacity: 0;
                transform: rotate(15deg) scale(0.5) translate(-20px, 20px);
            }

            100% {
                opacity: 1;
                transform: rotate(15deg) scale(1) translate(0, 0);
            }
        }

        /* Origin heart on the finger */
        .origin-heart {
            position: absolute;
            right: 20px;
            top: 60px;
            font-size: 24px;
            color: #ff69b4;
            opacity: 0;
            transform: scale(0);
            animation: popHeart 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 2.4s;
            text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
        }

        @keyframes popHeart {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Heart particles */
        .small-heart {
            position: absolute;
            font-size: 22px;
            /* Set size of small heart */
            color: #dc143c;
            /* Crimson */
            text-shadow: 0 0 5px rgba(220, 20, 60, 0.4);
            /* Transition for flight */
            transition: left 0.5s ease-out, top 0.5s ease-out, opacity 0.2s ease-in;
            opacity: 0;
            z-index: 10;
        }

        .heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* I Love You Text */
        .love-text {
            position: absolute;
            bottom: 80px;
            right: 170px;
            font-family: 'Georgia', serif;
            font-size: 65px;
            font-weight: normal;
            color: #dc143c;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.3), 0 0 30px rgba(220, 20, 60, 0.2);
            opacity: 0;
            letter-spacing: 1px;
            transition: opacity 2s ease-in-out, transform 2s ease-in-out;
            transform: translateY(20px);
        }

        .love-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.4);
            /* subtle gray */
            font-family: inherit;
            z-index: 20;
        }
    </style>
</head>

<body>
    <div class="card" id="mainCard">
        <!-- Floating hearts container -->
        <div id="heartContainer" class="heart-container"></div>

        <!-- Character and Biu Text -->
        <div class="character-wrapper">
            <svg class="character-svg" viewBox="0 0 200 200">
                <!-- Legs -->
                <path class="draw-line" d="M75 145 L75 170 Q80 175 85 170 L85 145" fill="none" stroke="#000"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <path class="draw-line" d="M115 145 L115 170 Q120 175 125 170 L125 145" fill="none" stroke="#000"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

                <!-- Body -->
                <path class="draw-line fill-white" d="M70 140 Q 65 110 100 110 Q 135 110 130 140 Z" fill="transparent"
                    stroke="#000" stroke-width="5" stroke-linejoin="round" />

                <!-- Right Arm (Gun Pose pointing right-up) -->
                <!-- Main arm -->
                <path class="draw-line fill-white" d="M125 125 L165 100 Q170 95 165 90 L155 95 Q145 105 130 115"
                    fill="transparent" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Thumb pointing up -->
                <path class="draw-line" d="M150 100 L 155 85 Q 160 80 155 90 L 150 95" fill="none" stroke="#000"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

                <!-- Left Hand (just a small stub on the left) -->
                <path class="draw-line" d="M70 120 Q60 130 65 135 Q70 140 75 135" fill="none" stroke="#000"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

                <!-- Head -->
                <ellipse class="draw-line main-head fill-white" cx="100" cy="80" rx="55" ry="45" fill="transparent"
                    stroke="#000" stroke-width="5" />

                <!-- Face Details -->
                <!-- Eyes -->
                <circle cx="80" cy="85" r="4" fill="#000" class="fade-in delay-1" />
                <circle cx="120" cy="85" r="4" fill="#000" class="fade-in delay-1" />

                <!-- Blushes -->
                <ellipse cx="65" cy="95" rx="8" ry="4" fill="#ffb6c1" class="fade-in delay-1 opacity-80" />
                <ellipse cx="135" cy="95" rx="8" ry="4" fill="#ffb6c1" class="fade-in delay-1 opacity-80" />

                <!-- Mouth -->
                <path d="M 95 95 Q 100 102 105 95" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"
                    class="draw-line delay-2" />
            </svg>

            <div class="biu-text" id="biuText">binu</div>

            <!-- Origin small heart on the finger -->
            <div class="origin-heart" id="originHeart">❤️</div>
        </div>

        <!-- I Love You Text -->
        <h1 class="love-text" id="loveText">Love You</h1>

        <!-- Watermark -->
        <div class="watermark">create by akku</div>
    </div>

    <script>
        const pattern = [
            "      00000     00000      ",
            "    000000000 000000000    ",
            "   000000000000000000000   ",
            "  00000000000000000000000  ",
            "  00000000000000000000000  ",
            "   000000000000000000000   ",
            "    0000000000000000000    ",
            "     00000000000000000     ",
            "      000000000000000      ",
            "       0000000000000       ",
            "        00000000000        ",
            "         000000000         ",
            "          0000000          ",
            "           00000           ",
            "            000            ",
            "             0             "
        ];

        const hearts = [];
        const startX = 360;
        const startY = 80;
        const cellSize = 18;

        // Parse the pattern to get target coordinates for each small heart
        for (let r = 0; r < pattern.length; r++) {
            for (let c = 0; c < pattern[r].length; c++) {
                if (pattern[r][c] === '0') {
                    hearts.push({
                        x: startX + c * cellSize,
                        y: startY + r * cellSize
                    });
                }
            }
        }

        // Origin position (tip of the character's finger)
        const originX = 330;
        const originY = 260;

        const container = document.getElementById('heartContainer');
        const loveText = document.getElementById('loveText');
        let currentIndex = 0;

        function resizeCard() {
            const card = document.getElementById('mainCard');
            const scale = Math.min(window.innerWidth / 950, window.innerHeight / 650, 1);
            card.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeCard);
        resizeCard();

        function shootHearts() {
            if (currentIndex >= hearts.length) {
                // Animation finished, show the text
                setTimeout(() => {
                    loveText.classList.add('show');
                }, 500);
                return;
            }

            const target = hearts[currentIndex];

            const heart = document.createElement('div');
            heart.className = 'small-heart';
            heart.innerHTML = '❤️'; // Little heart emoji

            // Style adjustments for correct sizing
            heart.style.fontSize = '14px';
            heart.style.lineHeight = '14px';
            heart.style.width = '14px';
            heart.style.height = '14px';

            // Set initial position at character's hand
            heart.style.left = originX + 'px';
            heart.style.top = originY + 'px';

            container.appendChild(heart);

            // Force a reflow to ensure the transition happens
            void heart.offsetWidth;

            // Move heart to its destination
            heart.style.opacity = '1';
            heart.style.left = target.x + 'px';
            heart.style.top = target.y + 'px';

            currentIndex++;

            // Shoot next heart quickly (25ms delay)
            setTimeout(shootHearts, 25);
        }

        // Wait for SVG line drawing animation to complete (approx 2.4s) before starting to shoot hearts
        window.onload = () => {
            setTimeout(() => {
                shootHearts();
            }, 2800);
        };
    </script>
</body>

</html>
